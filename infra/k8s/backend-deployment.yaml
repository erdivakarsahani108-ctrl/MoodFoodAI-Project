apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodfood-backend
  namespace: moodfood-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moodfood-backend
  template:
    metadata:
      labels:
        app: moodfood-backend
    spec:
      containers:
        - name: backend
          image: moodfood-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DSN
              value: postgresql://postgres:postgres@postgres:5432/moodfood
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: ALLOWED_ORIGINS
              value: http://localhost:3000
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
