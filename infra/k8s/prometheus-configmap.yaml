apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: moodfood-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        static_configs:
          - targets: ['moodfood-backend:8000', 'moodfood-frontend:3000']
