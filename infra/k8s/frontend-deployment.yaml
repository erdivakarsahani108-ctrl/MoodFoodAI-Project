apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodfood-frontend
  namespace: moodfood-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moodfood-frontend
  template:
    metadata:
      labels:
        app: moodfood-frontend
    spec:
      containers:
        - name: frontend
          image: moodfood-frontend:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
